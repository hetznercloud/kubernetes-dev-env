name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      id-token: write # Required by hetznercloud/tps-action

    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: v1.12.5 # renovate: datasource=github-releases depName=opentofu/opentofu
          tofu_wrapper: false

      - uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
        with:
          setup-tools: |
            kubectl
            skaffold
          kubectl: v1.36.4 # renovate: datasource=github-releases depName=kubernetes/kubernetes
          skaffold: v2.24.0 # renovate: datasource=github-releases depName=GoogleContainerTools/skaffold

      - name: Setup k3sup
        env:
          K3SUP_VERSION: 0.13.12 # renovate: datasource=github-releases depName=alexellis/k3sup
        run: |
          curl https://github.com/alexellis/k3sup/releases/download/$K3SUP_VERSION/k3sup -sSL -o /usr/local/bin/k3sup
          chmod +x /usr/local/bin/k3sup

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: test-app/go.mod

      - uses: hetznercloud/tps-action@5bfcef547f41c44aa626d0474c0491a1dbda792a # main

      - name: Swap module source
        run: |
          sed -i -e 's|source = ".*"|source = "../../modules/infra"|' infra/main.tf
          sed -i -e 's|source = ".*"|source = "../../modules/k8s"|' k8s/main.tf

      - name: Setup environment
        run: make up

      - name: Verify environment
        run: |
          source files/env.sh

          kubectl wait --for=condition=Ready --all node
          kubectl wait --for=condition=Available --all --all-namespaces deployment
          kubectl wait --for=condition=Ready --all --all-namespaces pod

      - name: Deploy test app
        working-directory: test-app
        run: |
          source ../example/files/env.sh

          skaffold run
          kubectl wait --for=condition=Ready --all pod -l app=test-app

      - name: Cleanup
        if: always()
        run: make down
